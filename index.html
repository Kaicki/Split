<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Splitter AI</title>
<link rel="stylesheet" href="style.css">
</head><body><div class="wrap">
<header><div class="logo">✂️</div><div><h1>Video Splitter <span>AI</span></h1><small>Divida vídeos direto no navegador. Nada é enviado para servidores.</small></div></header>

<section id="up">
 <div class="drop" id="drop"><div class="ico">🎬</div><b>Arraste um vídeo ou toque para escolher</b><p>MP4 · MOV · AVI · MKV · WebM</p>
 <input type="file" id="file" accept=".mp4,.mov,.avi,.mkv,.webm,video/*" hidden></div>
 <div class="bar" id="upbar" hidden><i></i></div><p class="mu" id="uptxt"></p>
</section>

<section id="ed" hidden><div class="grid">
 <div class="card"><video id="vid" controls playsinline></video><div class="chips" id="meta"></div></div>
 <div class="card">
  <div class="tabs" id="tabs"><button data-m="dur" class="on">⏱ Duração</button><button data-m="auto">🧠 Cenas (IA)</button><button data-m="qty">🔢 Quantidade</button><button data-m="manual">✋ Manual</button></div>
  <div data-p="dur"><label>Duração de cada parte (segundos)</label>
   <div class="pre" id="pre"><button data-s="15">15s</button><button data-s="30">30s</button><button data-s="60">1 min</button><button data-s="120">2 min</button></div>
   <input type="number" id="step" min="1" value="30"></div>
  <div data-p="auto" hidden><label>Sensibilidade de cena: <span id="thv">0.30</span></label>
   <input type="range" id="th" min="0.1" max="0.6" step="0.05" value="0.3" style="width:100%">
   <label>Duração mínima por trecho (s)</label><input type="number" id="minlen" min="1" value="5">
   <button id="scan" style="width:100%;margin-top:10px">🔍 Detectar cenas</button></div>
  <div data-p="qty" hidden><label>Número de partes</label><input type="number" id="qty" min="1" max="500" value="4"></div>
  <div data-p="manual" hidden><div id="rows"></div>
   <button id="addrow" style="width:100%">+ Adicionar trecho</button>
   <p class="sum">Formato: 83,5 ou 1:23.5. Use ⏺ para pegar o tempo atual do player.</p></div>
  <div class="sum" id="sum"></div>
  <label class="chk"><input type="checkbox" id="precise"><span>Corte preciso (re-codifica em H.264; bem mais lento no navegador). Desmarcado: cópia sem perdas, com cortes no quadro-chave mais próximo.</span></label>
  <button class="pri" id="go" style="width:100%">Dividir vídeo</button>
 </div></div></section>

<section id="pr" hidden><div class="card"><div class="big" id="pct">0%</div>
 <div class="bar"><i id="pbar"></i></div><p class="mu" id="eta">Iniciando…</p>
 <p class="mu"><button id="cancel">Cancelar</button></p></div></section>

<section id="rs" hidden>
 <div class="acts"><button class="pri" id="zip">⬇ Baixar tudo (ZIP)</button><button id="again">Nova divisão</button></div>
 <div class="parts" id="parts"></div></section>
</div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="script.js"></script>
</body></html>
